# ClaimGuard verifier baseline configuration (Step 9).
#
# Conservative, not-yet-tuned baseline. Uses the project's already-selected
# NLI verifier model (Step 3/5B) fine-tuned on the Step 9 baseline pool.
#
# IMPORTANT: as of Step 9, FEVER contributes ZERO usable records to this
# baseline - its evidence is reference-only (wiki_url/sentence_id), not
# resolved text, so no valid (premise, hypothesis) pair can be built from
# it without fabricating premise text (which is not done). The baseline
# trains on HaluEval qa/dialogue/summarization only. See
# PROJECT_REPORT.md Step 9 for the full explanation.

model:
  name: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
  num_labels: 3
  label_order: ["entailment", "neutral", "contradiction"]  # verified against the model's own id2label at load time, not assumed
  max_length: 256
  dtype: "bfloat16"

data:
  # Consumes the Step 8 pool files directly - does not rebuild the dataset.
  pool_train_path: "data/processed/verifier_pool/train.jsonl"
  pool_dev_path: "data/processed/verifier_pool/dev.jsonl"
  require_premise_text: true  # filters to premise-text-available records only (excludes all FEVER - documented, not silent)
  manifest_path: "data/processed/dataset_manifest.json"
  manifest_version_expected: "1.1"

training:
  seed: 42
  batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_epochs: 1
  warmup_ratio: 0.06
  lr_scheduler_type: "linear"
  mixed_precision: "bf16"
  max_grad_norm: 1.0
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  logging_steps: 50
  metric_for_best_model: "macro_f1"
  greater_is_better: true
  output_dir: "experiments/verifier_baseline"

smoke_test:
  max_train_samples: 32
  max_dev_samples: 16
  max_steps: 5
  eval_steps: 2
  save_steps: 2
  logging_steps: 1
