# ClaimGuard integration baseline configuration (Step 15).
#
# The FIRST integrated retrieval + reranking + binary-verifier experiment:
#
#     query -> BGE embedding -> FAISS top-K -> BGE reranker -> reranked
#           -> top-N -> binary DeBERTa verifier (per candidate)
#           -> aggregation (max entailment probability) -> selected evidence
#
# NOT the final ClaimGuard pipeline - no generator, no correction loop, no
# RAGTruth/TruthfulQA evaluation. ONE controlled baseline configuration -
# no parameter sweep, no threshold tuning.

pipeline:
  retrieval_top_k: 20   # unchanged from Step 13/14
  rerank_top_n: 5       # unchanged from Step 14
  verifier_max_length: 256   # unchanged from Step 9/12 (configs/verifier_binary_final.yaml)
  # INITIAL threshold only - never tuned against any benchmark. If
  # threshold selection becomes necessary later, it is a separate
  # controlled experiment (see PROJECT_REPORT.md Step 15).
  entailment_threshold: 0.5

verifier:
  checkpoint_dir: "experiments/verifier_binary_final/final"

evaluation:
  # Same FEVER-train-derived eval set construction as Steps 13/14 -
  # claimguard.retrieval.eval.build_eval_set with these exact parameters.
  seed: 42
  sample_size: 2000
  source: "fever_train"
  threshold_diagnostics: [0.5, 0.6, 0.7, 0.8, 0.9]
